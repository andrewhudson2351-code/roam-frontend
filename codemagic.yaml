workflows:
  ios-workflow:
    name: Roaman iOS
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic CI
    environment:
      groups:
        - roaman-secrets
      node: latest
      xcode: latest
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Verify Mapbox token present
        script: |
          case "$VITE_MAPBOX_TOKEN" in
            pk.*) echo "Mapbox token OK" ;;
            *) echo "VITE_MAPBOX_TOKEN is missing or not a valid pk.* token — map would be blank"; exit 1 ;;
          esac
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "app.roaman" \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing in Xcode project
        script: xcode-project use-profiles
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App" || {
              echo "=========== xcodebuild.log (tail) ===========";
              tail -200 xcodebuild.log 2>/dev/null || tail -200 /Users/builder/clone/xcodebuild.log 2>/dev/null;
              exit 1;
            }
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
